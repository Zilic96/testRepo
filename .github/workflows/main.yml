name: Basic Test Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  issues: write

jobs:
  basic-test:
    name: Run basic checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Print hello
        run: echo "Workflow is running!"

      - name: List files
        run: ls -R .

  
  deploy_prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: basic-test
    steps:
      - name: Manual Workflow Approval
      # You may pin to the exact commit or the version.
      # uses: trstringer/manual-approval@a824dad59ac64ac825ab8725599e483e24aa2815
        uses: trstringer/manual-approval@v1.9.0
        with:
          # Required approvers
          approvers: Zilic96
          # Secret
          secret: ${{ github.TOKEN }}
          # Minimum number of approvals to progress workflow
          minimum-approvals: 1
          
  



          
